version: 1
id: control/timeout-retry-idempotent
name: Baseline retry flow has one invoice effect
description: The healthy no-mutation control for timeout-after-write behavior.
protocol: mcp
transport: stdio
server:
  command: node
  args: [dist/examples/broken-invoice-server.js]
  cwd: ../..
effect_probes:
  - id: invoice_count
    source: tool
    tool: get_state
    path: invoices.length
    safety: declared_read_only
steps:
  - id: create
    call: create_invoice
    arguments:
      customer_id: cus_control
      amount: 100
      request_id: req_control_timeout
    retry:
      max_attempts: 2
      on: [timeout]
assertions:
  - id: exactly-one-invoice
    type: effect_equals
    effect: invoice_count
    expected: 1
    remediation: Keep the write idempotent when a response is delayed.
