version: 1
id: demo/disconnect-after-commit-duplicates
name: Disconnect after commit must not duplicate an invoice
description: A client-visible disconnect after a committed write must be treated as an uncertain outcome.
protocol: mcp
transport: stdio
server:
  command: node
  args: [dist/examples/broken-invoice-server.js]
  cwd: ../..
effect_probes:
  - id: invoice_count
    source: tool
    tool: get_state
    path: invoices.length
    safety: declared_read_only
steps:
  - id: create
    call: create_invoice
    arguments:
      customer_id: cus_1
      amount: 100
      request_id: req_disconnect
    retry:
      max_attempts: 2
      on: [transport_error]
mutations:
  - id: disconnect-after-commit
    type: disconnect_after_commit
    applies_to: create_invoice
    occurrence: 1
    seed: 1
assertions:
  - id: exactly-one-invoice
    type: effect_equals
    effect: invoice_count
    expected: 1
    remediation: Reconcile a disconnected write or enforce idempotency before retrying.
