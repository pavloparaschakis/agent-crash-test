version: 1
id: demo/malformed-output
name: Malformed structured output is detected
protocol: mcp
transport: stdio
server:
  command: node
  args: [dist/examples/broken-invoice-server.js]
  cwd: ../..
steps:
  - id: customer
    call: get_customer
    arguments:
      customer_id: cus_1
    capture: customer
mutations:
  - id: malformed-customer
    type: malformed_result
    applies_to: get_customer
    occurrence: 1
    seed: 1
assertions:
  - id: customer-id-preserved
    type: result_path_equals
    step: customer
    path: customer.id
    expected: cus_1
    remediation: Return valid structured content that matches the declared output schema.
