version: 1
id: demo/partial-success-duplicates
name: Partial success must not duplicate an invoice
description: A partial-success response carries enough ambiguity that a blind retry can duplicate the committed effect.
protocol: mcp
transport: stdio
server:
  command: node
  args: [dist/examples/broken-invoice-server.js]
  cwd: ../..
effect_probes:
  - id: invoice_count
    source: tool
    tool: get_state
    path: invoices.length
    safety: declared_read_only
steps:
  - id: create
    call: create_invoice
    arguments:
      customer_id: cus_1
      amount: 100
      request_id: req_partial
    retry:
      max_attempts: 2
      on: [retryable_error]
mutations:
  - id: partial-create
    type: partial_success
    applies_to: create_invoice
    occurrence: 1
    seed: 1
assertions:
  - id: exactly-one-invoice
    type: effect_equals
    effect: invoice_count
    expected: 1
    remediation: Reconcile partial success or enforce idempotency before retrying.
