version: 1
id: demo/stale-read-conflict-lost-update
name: Stale reads must not drive a conflicting write
description: A stale read returned across a conflict boundary must be detected before the workflow acts on it.
protocol: mcp
transport: stdio
server:
  command: node
  args: [dist/examples/broken-invoice-server.js]
  cwd: ../..
steps:
  - id: first
    call: get_customer
    arguments:
      customer_id: cus_1
    capture: first
  - id: second
    call: get_customer
    arguments:
      customer_id: cus_2
    capture: second
mutations:
  - id: stale-read
    type: stale_read_then_conflicting_write
    applies_to: get_customer
    occurrence: 2
    seed: 1
assertions:
  - id: second-customer-is-fresh
    type: result_path_equals
    step: second
    path: customer.id
    expected: cus_2
    remediation: Add version/context validation before applying a write based on a read.
