version: 1
id: demo/duplicate-call-duplicates
name: Duplicate invocation must not create a duplicate invoice
protocol: mcp
transport: stdio
server:
  command: node
  args: [dist/examples/broken-invoice-server.js]
  cwd: ../..
effect_probes:
  - id: invoice_count
    source: tool
    tool: get_state
    path: invoices.length
    safety: declared_read_only
steps:
  - id: create
    call: create_invoice
    arguments:
      customer_id: cus_1
      amount: 100
      request_id: req_duplicate
mutations:
  - id: duplicate-create
    type: duplicate_call
    applies_to: create_invoice
    occurrence: 1
    seed: 1
assertions:
  - id: exactly-one-invoice
    type: effect_equals
    effect: invoice_count
    expected: 1
    remediation: Make create_invoice idempotent before declaring idempotentHint.
