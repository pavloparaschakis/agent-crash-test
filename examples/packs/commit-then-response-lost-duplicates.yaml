version: 1
id: demo/commit-then-response-lost-duplicates
name: Response loss after commit must not duplicate an invoice
description: A committed write whose response is lost has an uncertain outcome and must not be blindly repeated.
protocol: mcp
transport: stdio
server:
  command: node
  args: [dist/examples/broken-invoice-server.js]
  cwd: ../..
effect_probes:
  - id: invoice_count
    source: tool
    tool: get_state
    path: invoices.length
    safety: declared_read_only
steps:
  - id: create
    call: create_invoice
    arguments:
      customer_id: cus_1
      amount: 100
      request_id: req_commit_lost
    retry:
      max_attempts: 2
      on: [timeout]
mutations:
  - id: response-lost-after-commit
    type: commit_then_response_lost
    applies_to: create_invoice
    occurrence: 1
    seed: 1
assertions:
  - id: exactly-one-invoice
    type: effect_equals
    effect: invoice_count
    expected: 1
    remediation: Query the outcome or enforce idempotency before retrying after response loss.
